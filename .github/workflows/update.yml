name: Update list

on:
  schedule:
    - cron: "17 * * * *" # chaque heure, à la minute 17 (évite le pic de :00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Generate README.md from the public Level API
        run: node scripts/generate.mjs

      - name: Commit only if the content changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No change, nothing to commit."
            exit 0
          fi
          git config user.name "level-bot"
          git config user.email "level-bot@users.noreply.github.com"
          git add README.md
          git commit -m "Update list ($(date -u +'%Y-%m-%d %H:00 UTC'))"
          git push
